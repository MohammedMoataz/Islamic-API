<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qur'an</title>
    <link rel="stylesheet" href="reader.css">
</head>
<body>
    <header class="topbar">
        <h1 class="brand">Qur'an</h1>
        <a href="#" id="open-options" class="topbar-link">Settings</a>
    </header>

    <main class="layout">
        <aside class="sidebar">
            <details class="bookmarks-panel" open>
                <summary>Bookmarks <span id="bookmarks-count" class="count"></span></summary>
                <ul id="bookmarks-list" class="bookmarks-list"></ul>
            </details>

            <div class="search-row">
                <input id="surah-search" type="search" placeholder="Search surah…" autocomplete="off" aria-label="Search surahs">
            </div>

            <ul id="surah-list" class="surah-list" aria-label="List of surahs"></ul>
        </aside>

        <section class="reader-pane" id="reader-pane">
            <div id="resume-banner" class="resume-banner" hidden>
                <span id="resume-text"></span>
                <button id="resume-go" type="button">Go</button>
                <button id="resume-dismiss" type="button" aria-label="Dismiss" class="icon-btn">✕</button>
            </div>

            <header id="surah-header" class="surah-header" hidden>
                <div class="basmala" id="basmala">﷽</div>
                <h2 class="surah-name-ar" id="surah-name-ar"></h2>
                <p class="surah-meta" id="surah-meta"></p>
            </header>

            <p id="reader-error" class="error" hidden></p>
            <p id="reader-loading" class="loading">Loading…</p>

            <ol id="ayat" class="ayat" aria-label="Ayat"></ol>
        </section>
    </main>

    <script type="module" src="reader.js"></script>
</body>
</html>
