<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Times — Settings</title>
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="stylesheet" href="options.css">
</head>
<body>
    <main class="container">
        <h1 data-i18n="options.title">Prayer Times — Settings</h1>

        <section class="card">
            <h2 data-i18n="options.display.title">Display</h2>
            <label>
                <span data-i18n="options.display.language">Language</span>
                <select id="language">
                    <option value="en" data-i18n="options.display.languageEn">English</option>
                    <option value="ar" data-i18n="options.display.languageAr">العربية</option>
                </select>
            </label>
            <label>
                <span data-i18n="options.display.theme">Theme</span>
                <select id="theme">
                    <option value="auto" data-i18n="options.display.themeAuto">Match system</option>
                    <option value="light" data-i18n="options.display.themeLight">Light</option>
                    <option value="dark" data-i18n="options.display.themeDark">Dark</option>
                </select>
            </label>
        </section>

        <section class="card">
            <h2 data-i18n="options.location.title">Location</h2>
            <label>
                <span data-i18n="options.location.country">Country</span>
                <select id="country"></select>
            </label>
            <label>
                <span data-i18n="options.location.city">City</span>
                <select id="city"></select>
            </label>
            <label>
                <span data-i18n="options.location.method">Calculation method</span>
                <select id="method">
                    <option value="0" data-i18n="options.method.0">Shia Ithna-Ashari, Leva Institute, Qum</option>
                    <option value="1" data-i18n="options.method.1">University of Islamic Sciences, Karachi</option>
                    <option value="2" data-i18n="options.method.2">Islamic Society of North America</option>
                    <option value="3" data-i18n="options.method.3">Muslim World League</option>
                    <option value="4" data-i18n="options.method.4">Umm Al-Qura University, Makkah</option>
                    <option value="5" data-i18n="options.method.5">Egyptian General Authority of Survey</option>
                    <option value="7" data-i18n="options.method.7">Institute of Geophysics, University of Tehran</option>
                    <option value="8" data-i18n="options.method.8">Gulf Region</option>
                    <option value="9" data-i18n="options.method.9">Kuwait</option>
                    <option value="10" data-i18n="options.method.10">Qatar</option>
                    <option value="11" data-i18n="options.method.11">Majlis Ugama Islam Singapura, Singapore</option>
                    <option value="12" data-i18n="options.method.12">Union Organization Islamic de France</option>
                    <option value="13" data-i18n="options.method.13">Diyanet İşleri Başkanlığı, Turkey</option>
                    <option value="14" data-i18n="options.method.14">Spiritual Administration of Muslims of Russia</option>
                    <option value="15" data-i18n="options.method.15">Moonsighting Committee Worldwide</option>
                </select>
            </label>
        </section>

        <section class="card">
            <h2 data-i18n="options.notifications.title">Notifications</h2>
            <label class="row">
                <input id="notif-enabled" type="checkbox">
                <span data-i18n="options.notifications.enabled">Enable prayer notifications</span>
            </label>
            <label>
                <span data-i18n="options.notifications.pre">Remind me this many minutes before each prayer</span>
                <input id="notif-pre" type="number" min="0" max="60" step="1">
            </label>
            <button id="test-notif" type="button" class="btn-secondary" data-i18n="options.notifications.test">Send test notification</button>
        </section>

        <section class="card">
            <h2 data-i18n="options.iqama.title">Iqama reminders</h2>
            <label class="row">
                <input id="iqama-enabled" type="checkbox">
                <span data-i18n="options.iqama.enabled">Notify me at iqama time (configurable minutes after each adhan)</span>
            </label>
            <label>
                <span data-i18n="options.iqama.offset.Fajr">Fajr — minutes after adhan</span>
                <input id="iqama-Fajr" type="number" min="0" max="60" step="1">
            </label>
            <label>
                <span data-i18n="options.iqama.offset.Dhuhr">Dhuhr — minutes after adhan</span>
                <input id="iqama-Dhuhr" type="number" min="0" max="60" step="1">
            </label>
            <label>
                <span data-i18n="options.iqama.offset.Asr">Asr — minutes after adhan</span>
                <input id="iqama-Asr" type="number" min="0" max="60" step="1">
            </label>
            <label>
                <span data-i18n="options.iqama.offset.Maghrib">Maghrib — minutes after adhan</span>
                <input id="iqama-Maghrib" type="number" min="0" max="60" step="1">
            </label>
            <label>
                <span data-i18n="options.iqama.offset.Isha">Isha — minutes after adhan</span>
                <input id="iqama-Isha" type="number" min="0" max="60" step="1">
            </label>
        </section>

        <section class="card">
            <h2 data-i18n="options.hadith.title">Hadith</h2>
            <label>
                <span data-i18n="options.hadith.defaultBook">Default collection (Hadith of the Day)</span>
                <select id="hadith-book"></select>
            </label>
            <label class="row">
                <input id="hadith-daily-enabled" type="checkbox">
                <span data-i18n="options.hadith.dailyEnabled">Send Hadith of the Day notification</span>
            </label>
            <label>
                <span data-i18n="options.hadith.dailyTime">Notification time</span>
                <input id="hadith-daily-time" type="time" value="15:00">
            </label>
        </section>

        <section class="card">
            <h2 data-i18n="options.azkar.title">Azkar reminders</h2>
            <label class="row">
                <input id="azkar-reminders" type="checkbox">
                <span data-i18n="options.azkar.enabled">Send azkar reminder notifications</span>
            </label>
            <label>
                <span data-i18n="options.azkar.interval">Average minutes between reminders (random within ±50%)</span>
                <select id="azkar-interval">
                    <option value="15" data-i18n="options.azkar.interval.15">~ 15 minutes</option>
                    <option value="30" data-i18n="options.azkar.interval.30">~ 30 minutes</option>
                    <option value="60" data-i18n="options.azkar.interval.60">~ 1 hour</option>
                    <option value="90" data-i18n="options.azkar.interval.90">~ 1.5 hours</option>
                    <option value="120" data-i18n="options.azkar.interval.120">~ 2 hours</option>
                    <option value="180" data-i18n="options.azkar.interval.180">~ 3 hours</option>
                    <option value="240" data-i18n="options.azkar.interval.240">~ 4 hours</option>
                    <option value="360" data-i18n="options.azkar.interval.360">~ 6 hours</option>
                </select>
            </label>
            <p class="card-note" data-i18n="options.azkar.note">
                Windows follow your configured prayer times: morning azkar from Fajr to Maghrib, evening azkar from Maghrib to the next Fajr.
            </p>
        </section>

        <section class="card">
            <h2 data-i18n="options.quran.title">Qur'an</h2>
            <label>
                <span data-i18n="options.quran.tafsir">Tafsir edition</span>
                <select id="tafsir-slug"></select>
            </label>
            <label class="row">
                <input id="tafsir-default" type="checkbox">
                <span data-i18n="options.quran.showTafsir">Show tafsir by default when opening a surah</span>
            </label>
            <label>
                <span data-i18n="options.quran.reciter">Reciter (audio)</span>
                <select id="reciter">
                    <option value="">Loading…</option>
                </select>
            </label>
        </section>

        <div class="actions">
            <button id="save-btn" type="button" class="btn-primary" disabled data-i18n="options.save">Save</button>
            <p id="status" class="status" aria-live="polite"></p>
        </div>
    </main>
    <script type="module" src="options.js"></script>
</body>
</html>
