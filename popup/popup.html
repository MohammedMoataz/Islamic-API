<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prayer Times</title>
    <link rel="stylesheet" href="../styles/theme.css">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <main id="container">
        <header>
            <h1 id="city-line" data-i18n="popup.cityFallback">Prayer Times</h1>
            <p id="hijri-line"></p>
        </header>

        <div id="countdown" class="countdown" hidden>
            <span id="countdown-name"></span>
            <span class="countdown-sep" data-i18n="popup.in">in</span>
            <span id="countdown-value" class="countdown-value"></span>
        </div>

        <p id="error" class="error" hidden></p>

        <table id="prayer-table">
            <thead>
                <tr>
                    <th data-i18n="popup.headerPrayer">Prayer</th>
                    <th data-i18n="popup.headerTime">Time</th>
                </tr>
            </thead>
            <tbody id="prayer-times"></tbody>
        </table>

        <section id="qibla-card" class="qibla-card" hidden>
            <svg class="compass" viewBox="0 0 100 100" aria-hidden="true">
                <circle class="compass-ring" cx="50" cy="50" r="44" />
                <text class="compass-cardinal" x="50" y="14" text-anchor="middle">N</text>
                <text class="compass-cardinal" x="86" y="54" text-anchor="middle">E</text>
                <text class="compass-cardinal" x="50" y="94" text-anchor="middle">S</text>
                <text class="compass-cardinal" x="14" y="54" text-anchor="middle">W</text>
                <g id="qibla-needle">
                    <polygon class="needle-arrow" points="50,8 46,52 54,52" />
                    <polygon class="needle-tail"  points="50,92 47,52 53,52" />
                </g>
                <circle class="compass-pin" cx="50" cy="50" r="3" />
            </svg>
            <div class="qibla-info">
                <div class="qibla-label" data-i18n="qibla.label">Qibla</div>
                <div class="qibla-degrees" id="qibla-degrees">—</div>
                <div class="qibla-status" id="qibla-status"></div>
                <button id="qibla-calibrate" class="qibla-calibrate" type="button" hidden data-i18n="qibla.enableBtn">Enable live compass</button>
            </div>
        </section>

        <section id="hadith-card" class="hadith-card" hidden>
            <div class="hadith-card-head">
                <span class="hadith-card-label" data-i18n="popup.hadithOfDay">Hadith of the Day</span>
                <span class="hadith-card-meta" id="hadith-card-meta"></span>
            </div>
            <p class="hadith-card-arab" id="hadith-card-arab"></p>
            <p class="hadith-card-id" id="hadith-card-id"></p>
        </section>

        <section id="audio-mini" class="audio-mini" hidden aria-label="Qur'an audio">
            <button id="audio-mini-toggle" class="audio-mini-btn audio-mini-toggle" type="button" aria-label="Play / pause">⏸</button>
            <div class="audio-mini-info">
                <div class="audio-mini-title" id="audio-mini-title">—</div>
                <div class="audio-mini-time" id="audio-mini-time">0:00 / 0:00</div>
            </div>
            <button id="audio-mini-stop" class="audio-mini-btn" type="button" aria-label="Stop">✕</button>
        </section>

        <button id="open-quran" class="btn-read-quran" type="button" data-i18n="popup.openQuran">Read Qur'an</button>
        <button id="open-hadith" class="btn-read-hadith" type="button" data-i18n="popup.openHadith">Browse Hadith</button>
        <button id="open-azkar" class="btn-read-hadith" type="button" data-i18n="popup.openAzkar">Open Azkar</button>
        <button id="open-radio" class="btn-read-hadith" type="button" data-i18n="popup.openRadio">Open Radio</button>

        <footer>
            <a href="#" id="settings-link" data-i18n="popup.settings">Settings</a>
        </footer>
    </main>
    <script type="module" src="popup.js"></script>
</body>
</html>
